name: Update profile

on:
  schedule:
    - cron: "17 3 * * *"  # daily, off the top of the hour
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run update script
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_profile.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/stats.svg assets/stats-light.svg
          git commit -m "chore: automated profile refresh" -m "Recomputed from real GitHub data by scripts/update_profile.py. Hand-written entries in data/projects.json and data/patches.json are left as-written; only genuinely new repos/patches get a plain placeholder until someone adds an override."
          git push
