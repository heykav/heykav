name: SEO health check

on:
  schedule:
    - cron: "37 3 * * *"  # daily, ~20 min after the profile refresh
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run SEO health check
        id: seo_check
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          # Optional: a classic PAT (repo scope) or fine-grained PAT
          # (Administration: write) added as a repo secret named SEO_PAT.
          # Without it, a homepage/Pages-URL mismatch is still detected
          # and recorded in reports/seo-status.md, just not auto-fixed -
          # the workflow's own GITHUB_TOKEN can't write to other repos.
          SEO_PAT: ${{ secrets.SEO_PAT }}
        run: python3 scripts/seo_health_check.py

      - name: Commit the report if it changed
        run: |
          git add -A -- reports/seo-status.md
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: SEO health check" -m "Regenerated by scripts/seo_health_check.py."
          git push

      - name: Fail the run if a monitored page is actually down
        if: steps.seo_check.outcome == 'failure'
        run: |
          echo "::error::A monitored page is down or the personal domain is still the Hostinger parked page - see reports/seo-status.md."
          exit 1
