<rect x="92" y="306" width="33" height="25" rx="4" fill="#0f2a19" stroke="#2a2c29" stroke-width="1"/>
<rect x="128" y="306" width="33" height="25" rx="4" fill="#0f2a19" stroke="#2a2c29" stroke-width="1"/>
