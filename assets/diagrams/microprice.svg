<text x="92" y="374" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#9a9c96">0</text>
<text x="269" y="374" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#9a9c96" text-anchor="end">1</text>
<text x="50" y="242" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="12" fill="#9a9c96"></text>
