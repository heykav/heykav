<svg width="1200" height="506" viewBox="0 0 1200 506" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mp-t mp-d">
<title id="mp-t">Micro-price mechanism diagram</title>
<desc id="mp-d">Four steps. One: the top-of-book is reduced to queue imbalance and spread and bucketed into a state. Two: consecutive events are counted; transitions without a mid-price change form the matrix Q, and the expected one-step mid change forms G1. Three: G star equals G1 plus Q times G star, solved by fixed-point iteration without inverting the matrix. Four: micro-price equals mid plus G star of the current state. Bucket grid, graph and offset are illustrative.</desc>
