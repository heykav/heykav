<text x="371" y="266" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#F4F5F2" text-anchor="middle">i</text>
<circle cx="469" cy="238" r="15" fill="#090A09" stroke="#00FF66" stroke-width="1.5"/>
<text x="469" y="242" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#F4F5F2" text-anchor="middle">j</text>
<circle cx="469" cy="288" r="15" fill="#090A09" stroke="#00FF66" stroke-width="1.5"/>
<text x="469" y="292" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#F4F5F2" text-anchor="middle">k</text>
<line x1="385" y1="257" x2="453" y2="242" stroke="#00FF66" stroke-width="1.6" marker-end="url(#mp-ar)"/>
<line x1="385" y1="268" x2="453" y2="284" stroke="#00FF66" stroke-width="1.6" marker-end="url(#mp-ar)"/>
<line x1="469" y1="255" x2="469" y2="270" stroke="#00FF66" stroke-width="1.6" marker-end="url(#mp-ar)"/>
<line x1="387" y1="262" x2="555" y2="262" stroke="#9a9c96" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#mp-am)"/>
<text x="559" y="258" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#9a9c96">mid</text>
<text x="559" y="272" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#9a9c96">moves</text>
<text x="339" y="316" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="12" fill="#9a9c96">arrows illustrative</text>
<rect x="335" y="326" width="253" height="50" rx="6" fill="#090A09" stroke="#2a2c29" stroke-width="1"/>
<text x="345" y="345" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#00FF66" font-weight="700">delta = 0  ->  Q</text>
<text x="345" y="365" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#F4F5F2">Q[i][j] = count[i][j] / visits[i]</text>
<rect x="335" y="382" width="253" height="50" rx="6" fill="#090A09" stroke="#2a2c29" stroke-width="1"/>
<text x="345" y="401" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#00FF66" font-weight="700">delta != 0  ->  G1</text>
<text x="345" y="421" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#F4F5F2">G1[i] = delta_sum[i] / visits[i]</text>
<text x="648" y="178" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="18" fill="#F4F5F2" font-weight="700">G* = G1 + Q G*</text>
<text x="648" y="204" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="14" fill="#c7c9c4">   = (I - Q)^-1 G1</text>
<rect x="644" y="224" width="233" height="104" rx="6" fill="#090A09" stroke="#2a2c29" stroke-width="1"/>
<text x="654" y="246" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#00FF66" font-weight="700">fixed-point iteration</text>
<text x="654" y="268" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#F4F5F2">G*_0 = G1</text>
<text x="654" y="288" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#F4F5F2">G*_k+1 = G1 + Q G*_k</text>
<text x="654" y="310" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#c7c9c4">until max|change| &lt; tolerance</text>
<text x="648" y="354" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="12" fill="#c7c9c4">No matrix inverse is formed.</text>
<text x="648" y="374" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="12" fill="#c7c9c4">Q is sub-stochastic: it holds only</text>
<text x="648" y="392" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="12" fill="#c7c9c4">non-price-changing moves.</text>
<text x="648" y="416" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="12" fill="#c7c9c4">No convergence returns an error.</text>
<text x="937" y="174" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="13" fill="#F4F5F2">micro-price</text>
<text x="937" y="194" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="15" fill="#00FF66" font-weight="700">= mid + G*[state]</text>
<line x1="977" y1="252" x2="1127" y2="252" stroke="#9a9c96" stroke-width="2"/>
<text x="969" y="256" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#9a9c96" text-anchor="end">ask Pa</text>
<line x1="977" y1="362" x2="1127" y2="362" stroke="#9a9c96" stroke-width="2"/>
<text x="969" y="366" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#9a9c96" text-anchor="end">bid Pb</text>
<line x1="977" y1="307" x2="1127" y2="307" stroke="#9a9c96" stroke-width="1.4" stroke-dasharray="4 4"/>
<text x="969" y="311" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#9a9c96" text-anchor="end">mid</text>
<line x1="1017" y1="307" x2="1017" y2="276" stroke="#00FF66" stroke-width="1.6" marker-end="url(#mp-ar)"/>
<text x="1027" y="294" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#00FF66">G*[state]</text>
<circle cx="1017" cy="272" r="6" fill="#00FF66"/>
<text x="1089" y="276" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#00FF66" text-anchor="middle">micro-price</text>
<text x="937" y="398" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="12" fill="#9a9c96">Offset shown is illustrative.</text>
<text x="937" y="416" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="12" fill="#c7c9c4">Prediction is allocation-free.</text>
<text x="36" y="482" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="12" fill="#9a9c96">Q, G1 and G* are estimated from counted transitions (Laplace-smoothed). Definitions: docs/model-spec.md. Stoikov (2018).</text>
