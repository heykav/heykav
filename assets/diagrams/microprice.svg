<rect x="628" y="112" width="265" height="336" rx="10" fill="#0d0e0c" stroke="#2a2c29" stroke-width="1"/><circle cx="650" cy="136" r="10" fill="#00FF66"/><text x="650" y="140" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#090A09" font-weight="700" text-anchor="middle">3</text><text x="668" y="140" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#c7c9c4" font-weight="700" letter-spacing="1.2">SOLVE FOR G*</text>
