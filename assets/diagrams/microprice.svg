<text x="50" y="398" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#F4F5F2">state_id = spread_bucket * N</text>
<text x="50" y="416" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#F4F5F2">          + imbalance_bucket</text>
<text x="50" y="436" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="12" fill="#9a9c96">grid and highlighted cell: illustrative</text>
<text x="339" y="170" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="12" fill="#c7c9c4">Consecutive events give</text>
<text x="339" y="188" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="12" fill="#c7c9c4">state_i to state_j, with</text>
<text x="339" y="206" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#F4F5F2">delta = mid(t+1) - mid(t)</text>
