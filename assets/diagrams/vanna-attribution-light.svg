<svg width="1200" height="548" viewBox="0 0 1200 548" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="va-t va-d">
<title id="va-t">Vanna P&amp;L attribution diagram</title>
<desc id="va-d">A schematic waterfall. Total P&amp;L is the full reprice at the end minus the start. It is split into delta, gamma, theta, vega, vanna and volga terms from a second-order Taylor expansion using Greeks at the start of the period, plus a separately drawn hatched residual bar equal to actual P&amp;L minus the sum of the six terms. Bar heights are illustrative and carry no data.</desc>
<defs>
<marker id="va-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00A84A"/></marker>
<marker id="va-am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#54564f"/></marker>
<pattern id="va-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fbf0da"/><rect width="3" height="8" fill="#9a5b00"/></pattern>
<clipPath id="va-clip"><rect width="1200" height="548" rx="14"/></clipPath>
</defs>
<g clip-path="url(#va-clip)">
<rect width="1200" height="548" fill="#F4F5F2"/>
<rect width="1200" height="32" fill="#eceeea"/>
<circle cx="24" cy="16" r="6" fill="#FF5F57"/><circle cx="44" cy="16" r="6" fill="#FEBC2E"/><circle cx="64" cy="16" r="6" fill="#28C840"/>
<text x="600" y="20" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#54564f" text-anchor="middle">vanna  |  P&amp;L attribution  |  illustrative diagram</text>
<rect y="32" width="1200" height="1" fill="#c4c7c0"/>
<text x="36" y="72" font-family='Georgia,"Times New Roman",serif' font-size="22" fill="#111211" font-weight="700">How vanna splits a trade's P&amp;L</text><text x="36" y="94" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#54564f">vanna  |  vanna/backtest/attribution.py</text>
<rect x="36" y="112" width="1128" height="44" rx="8" fill="#ffffff" stroke="#c4c7c0" stroke-width="1"/>
<text x="52" y="131" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12.5" fill="#111211">dV ~ Delta dS + 1/2 Gamma dS^2 + Theta dt + Vega dSigma + Vanna dS dSigma + 1/2 Volga dSigma^2</text>
<text x="52" y="148" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="11" fill="#54564f">Second-order Taylor expansion, Greeks taken at the start of the period.</text>
<line x1="40" y1="372" x2="1160" y2="372" stroke="#c4c7c0" stroke-width="1.5"/>
<path d="M62 206 v-8 H846 v8" fill="none" stroke="#54564f" stroke-width="1.2"/>
<text x="454" y="190" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="11" fill="#54564f" text-anchor="middle">explained by the six terms</text>
<rect x="62" y="262" width="84" height="110" rx="3" fill="#00A84A"/>
<text x="104" y="255" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="13" fill="#111211" font-weight="700" text-anchor="middle">+</text>
<line x1="146" y1="262" x2="202" y2="262" stroke="#54564f" stroke-width="1" stroke-dasharray="3 3"/>
<text x="104" y="394" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="13" fill="#111211" font-weight="700" text-anchor="middle">delta</text>
<text x="104" y="410" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="11" fill="#54564f" text-anchor="middle">Delta*dS</text>
<rect x="202" y="232" width="84" height="30" rx="3" fill="#00A84A"/>
<text x="244" y="225" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="13" fill="#111211" font-weight="700" text-anchor="middle">+</text>
<line x1="286" y1="232" x2="342" y2="232" stroke="#54564f" stroke-width="1" stroke-dasharray="3 3"/>
<text x="244" y="394" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="13" fill="#111211" font-weight="700" text-anchor="middle">gamma</text>
<text x="244" y="410" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="10.5" fill="#54564f" text-anchor="middle">1/2*Gamma*dS^2</text>
<rect x="342" y="232" width="84" height="50" rx="3" fill="#6d7fa3"/>
<text x="384" y="297" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="13" fill="#111211" font-weight="700" text-anchor="middle">-</text>
<line x1="426" y1="282" x2="482" y2="282" stroke="#54564f" stroke-width="1" stroke-dasharray="3 3"/>
<text x="384" y="394" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="13" fill="#111211" font-weight="700" text-anchor="middle">theta</text>
<text x="384" y="410" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="11" fill="#54564f" text-anchor="middle">Theta*dt</text>
<rect x="482" y="222" width="84" height="60" rx="3" fill="#00A84A"/>
<text x="524" y="215" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="13" fill="#111211" font-weight="700" text-anchor="middle">+</text>
<line x1="566" y1="222" x2="622" y2="222" stroke="#54564f" stroke-width="1" stroke-dasharray="3 3"/>
<text x="524" y="394" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="13" fill="#111211" font-weight="700" text-anchor="middle">vega</text>
<text x="524" y="410" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="11" fill="#54564f" text-anchor="middle">Vega*dSigma</text>
<rect x="622" y="222" width="84" height="25" rx="3" fill="#6d7fa3"/>
<text x="664" y="262" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="13" fill="#111211" font-weight="700" text-anchor="middle">-</text>
<line x1="706" y1="247" x2="762" y2="247" stroke="#54564f" stroke-width="1" stroke-dasharray="3 3"/>
<text x="664" y="394" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="13" fill="#111211" font-weight="700" text-anchor="middle">vanna</text>
<text x="664" y="410" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="10.5" fill="#54564f" text-anchor="middle">Vanna*dS*dSigma</text>
<rect x="762" y="235" width="84" height="12" rx="3" fill="#00A84A"/>
<text x="804" y="228" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="13" fill="#111211" font-weight="700" text-anchor="middle">+</text>
<line x1="846" y1="235" x2="902" y2="235" stroke="#54564f" stroke-width="1" stroke-dasharray="3 3"/>
<text x="804" y="394" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="13" fill="#111211" font-weight="700" text-anchor="middle">volga</text>
<text x="804" y="410" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="10.5" fill="#54564f" text-anchor="middle">1/2*Volga*dSigma^2</text>
<rect x="902" y="235" width="84" height="18" rx="3" fill="url(#va-hatch)" stroke="#9a5b00" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="944" y="268" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="13" fill="#111211" font-weight="700" text-anchor="middle">-</text>
<line x1="986" y1="253" x2="1042" y2="253" stroke="#54564f" stroke-width="1" stroke-dasharray="3 3"/>
<text x="944" y="394" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="13" fill="#9a5b00" font-weight="700" text-anchor="middle">residual</text>
<text x="944" y="410" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="10.5" fill="#54564f" text-anchor="middle">actual - sum of terms</text>
<rect x="1042" y="253" width="84" height="119" rx="3" fill="none" stroke="#00A84A" stroke-width="2"/>
<text x="1084" y="316" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="13" fill="#006b2e" font-weight="700" text-anchor="middle">total</text>
<text x="1084" y="394" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="13" fill="#006b2e" font-weight="700" text-anchor="middle">total P&amp;L</text>
<text x="1084" y="410" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="11" fill="#54564f" text-anchor="middle">v1 - v0</text>
<text x="1160" y="132" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="10" fill="#54564f"></text>
<text x="36" y="222" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="11" fill="#54564f">schematic</text>
<text x="36" y="236" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="11" fill="#54564f">not data</text>
<rect x="36" y="436" width="368" height="64" rx="8" fill="#ffffff" stroke="#c4c7c0" stroke-width="1"/>
<text x="50" y="460" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="12.5" fill="#111211" font-weight="700">Total is a full reprice</text>
<text x="50" y="480" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="11" fill="#3d3f3b">v1 - v0, with each leg valued at end and start spot, vol</text>
<text x="50" y="494" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="11" fill="#3d3f3b">and time.</text>
<rect x="416" y="436" width="368" height="64" rx="8" fill="#ffffff" stroke="#c4c7c0" stroke-width="1"/>
<text x="430" y="460" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="12.5" fill="#111211" font-weight="700">Residual stays visible</text>
<text x="430" y="480" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="11" fill="#3d3f3b">It is actual P&amp;L minus the six terms. It is never folded</text>
<text x="430" y="494" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="11" fill="#3d3f3b">into a bucket.</text>
<rect x="796" y="436" width="368" height="64" rx="8" fill="#ffffff" stroke="#c4c7c0" stroke-width="1"/>
<text x="810" y="460" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="12.5" fill="#111211" font-weight="700">Tested, not assumed</text>
<text x="810" y="480" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="11" fill="#3d3f3b">tests/test_attribution.py checks the residual shrinks</text>
<text x="810" y="494" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="11" fill="#3d3f3b">roughly cubically.</text>
<text x="36" y="528" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="12" fill="#54564f">Bar heights are illustrative; no values are shown because none are claimed.</text>
</g>
</svg>
