<text x="240" y="224" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="11.5" fill="#3d3f3b">AXI4-Stream 512-bit</text>
<text x="240" y="241" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="11.5" fill="#3d3f3b">beats with an inter-</text>
<text x="240" y="258" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="11.5" fill="#3d3f3b">packet-gap check.</text>
