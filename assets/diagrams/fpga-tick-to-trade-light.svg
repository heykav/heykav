<rect x="418" y="122" width="170" height="170" rx="10" fill="#ffffff" stroke="#c4c7c0" stroke-width="1"/>
<circle cx="440" cy="146" r="10" fill="#00A84A"/>
<text x="440" y="150" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="458" y="150" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="13" fill="#111211" font-weight="700" letter-spacing="1">ITCH</text>
<text x="434" y="178" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="13" fill="#111211" font-weight="700">parser</text>
<text x="434" y="198" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="11" fill="#006b2e">parser_itch50.hpp</text>
<text x="434" y="224" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="11.5" fill="#3d3f3b">Zero-copy big-endian</text>
<text x="434" y="241" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="11.5" fill="#3d3f3b">ITCH 5.0 for A, E and X</text>
<text x="434" y="258" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="11.5" fill="#3d3f3b">messages.</text>
<line x1="590" y1="187" x2="610" y2="187" stroke="#00A84A" stroke-width="1.6" marker-end="url(#fp-ar)"/>
<rect x="612" y="122" width="170" height="170" rx="10" fill="#ffffff" stroke="#c4c7c0" stroke-width="1"/>
<circle cx="634" cy="146" r="10" fill="#00A84A"/>
<text x="634" y="150" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<text x="652" y="150" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="13" fill="#111211" font-weight="700" letter-spacing="1">ORDER</text>
<text x="628" y="178" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="13" fill="#111211" font-weight="700">book</text>
<text x="628" y="198" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="11" fill="#006b2e">order_book.hpp</text>
<text x="628" y="224" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="11.5" fill="#3d3f3b">Five-level book over a</text>
<text x="628" y="241" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="11.5" fill="#3d3f3b">dual-port BRAM model.</text>
<line x1="784" y1="187" x2="804" y2="187" stroke="#00A84A" stroke-width="1.6" marker-end="url(#fp-ar)"/>
<rect x="806" y="122" width="170" height="170" rx="10" fill="#ffffff" stroke="#c4c7c0" stroke-width="1"/>
<circle cx="828" cy="146" r="10" fill="#00A84A"/>
<text x="828" y="150" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
<text x="846" y="150" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="13" fill="#111211" font-weight="700" letter-spacing="1">OFI</text>
<text x="822" y="178" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="13" fill="#111211" font-weight="700">order-flow imbalance</text>
<text x="822" y="198" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="11" fill="#006b2e">ofi_dsp.hpp</text>
<text x="822" y="224" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="11.5" fill="#3d3f3b">Three-cycle signed</text>
<text x="822" y="241" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="11.5" fill="#3d3f3b">32-bit pipeline, plus a</text>
<text x="822" y="258" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="11.5" fill="#3d3f3b">micro-price LUT.</text>
<line x1="978" y1="187" x2="998" y2="187" stroke="#00A84A" stroke-width="1.6" marker-end="url(#fp-ar)"/>
