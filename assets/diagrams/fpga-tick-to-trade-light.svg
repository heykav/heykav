<rect y="32" width="1200" height="1" fill="#c4c7c0"/>
<text x="36" y="72" font-family='Georgia,"Times New Roman",serif' font-size="22" fill="#111211" font-weight="700">Tick-to-trade path, modelled cycle by cycle</text><text x="36" y="94" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#54564f">fpga-sim-core  |  include/modules, main.cpp</text>
<rect x="760" y="50" width="404" height="34" rx="17" fill="#fbf0da" stroke="#9a5b00" stroke-width="1.4"/>
<text x="962" y="72" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="11.5" fill="#9a5b00" font-weight="700" text-anchor="middle" letter-spacing="0.6">CYCLE-MODELLED SIMULATION, NOT HARDWARE</text>
<rect x="30" y="122" width="170" height="170" rx="10" fill="#ffffff" stroke="#c4c7c0" stroke-width="1"/>
<circle cx="52" cy="146" r="10" fill="#00A84A"/>
<text x="52" y="150" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="70" y="150" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="13" fill="#111211" font-weight="700" letter-spacing="1">PCS</text>
<text x="46" y="178" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="13" fill="#111211" font-weight="700">block decode</text>
<text x="46" y="198" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="11" fill="#006b2e">phy_pcs.hpp</text>
<text x="46" y="224" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="11.5" fill="#3d3f3b">Block lock and CRC32</text>
<text x="46" y="241" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="11.5" fill="#3d3f3b">check.</text>
<text x="46" y="258" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="11.5" fill="#3d3f3b">64b/66b-inspired, not</text>
<text x="46" y="275" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="11.5" fill="#3d3f3b">802.3 conformant.</text>
<line x1="202" y1="187" x2="222" y2="187" stroke="#00A84A" stroke-width="1.6" marker-end="url(#fp-ar)"/>
