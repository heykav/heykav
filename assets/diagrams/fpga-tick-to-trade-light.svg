<text x="1022" y="150" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">6</text>
<text x="1040" y="150" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="13" fill="#111211" font-weight="700" letter-spacing="1">DMA</text>
<text x="1016" y="178" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="13" fill="#111211" font-weight="700">host write</text>
<text x="1016" y="198" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="11" fill="#006b2e">pcie_dma.hpp</text>
<text x="1016" y="224" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="11.5" fill="#3d3f3b">PCIe Gen4 x16 TLP and</text>
<text x="1016" y="241" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="11.5" fill="#3d3f3b">MSI-X model,</text>
<text x="1016" y="258" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="11.5" fill="#3d3f3b">preallocated rings.</text>
<rect x="30" y="320" width="1140" height="74" rx="10" fill="#ffffff" stroke="#c4c7c0" stroke-width="1"/>
<text x="46" y="344" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#006b2e" font-weight="700">DiscreteEngine</text>
<text x="46" y="364" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="12" fill="#3d3f3b">A cycle counter drives posedge and negedge callbacks held in a fixed 16-slot array.</text>
<text x="46" y="382" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="12" fill="#3d3f3b">No wall-clock time in the hot path. Model clock 322.265625 MHz.</text>




























