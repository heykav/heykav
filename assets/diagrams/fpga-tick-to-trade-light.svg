<svg width="1200" height="542" viewBox="0 0 1200 542" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fp-t fp-d">
<title id="fp-t">fpga-sim-core tick-to-trade path diagram</title>
<desc id="fp-d">A software cycle model, not hardware. Six modelled stages in order: PCS block decode with CRC, MAC framer, ITCH 5.0 parser, five-level order book, order-flow imbalance pipeline, and a PCIe DMA model. A cycle counter drives the stages and a VCD trace is written. All timing is simulated; the demo timeline is scripted stimulus, not a measured latency.</desc>
<defs>
<marker id="fp-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00A84A"/></marker>
<marker id="fp-am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#54564f"/></marker>
<pattern id="fp-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fbf0da"/><rect width="3" height="8" fill="#9a5b00"/></pattern>
<clipPath id="fp-clip"><rect width="1200" height="542" rx="14"/></clipPath>
</defs>
<g clip-path="url(#fp-clip)">
<rect width="1200" height="542" fill="#F4F5F2"/>
<rect width="1200" height="32" fill="#eceeea"/>
