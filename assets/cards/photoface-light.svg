cy="166" r="4" fill="#54564f"/><circle class="pop" style="animation-delay:1.14s" cx="478" cy="174" r="4" fill="#54564f"/><circle class="pop" style="animation-delay:1.20s" cx="508" cy="182" r="4" fill="#54564f"/>
<rect class="sweep" x="0" y="31" width="40" height="219" fill="#00A84A" fill-opacity="0.035"/>
<rect x="0.5" y="0.5" width="639" height="249" rx="14" fill="none" stroke="#c4c7c0"/>
</g>
