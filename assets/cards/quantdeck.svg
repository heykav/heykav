<svg width="640" height="250" viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">quantdeck</title>
<desc id="d">Event-driven backtesting in Python, market orders only, filled at the next bar&#x27;s open plus slippage. Runs offline on CSV files. Backtest only: no live or paper trading. Decorative graphic, no data.</desc>
<defs>
<pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1a1b1a" stroke-width="1"/></pattern>
<clipPath id="c"><rect width="640" height="250" rx="14"/></clipPath>
<radialGradient id="o" cx="0.78" cy="0.55" r="0.5"><stop offset="0%" stop-color="#00FF66" stop-opacity="0.10"/><stop offset="100%" stop-color="#00FF66" stop-opacity="0"/></radialGradient>
</defs>
<style>
.rise{transform-box:fill-box;transform-origin:50% 100%;animation:rise 8s cubic-bezier(.2,.8,.2,1) infinite}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:rise 8s cubic-bezier(.2,.8,.2,1) infinite}
.pop{transform-box:fill-box;transform-origin:50% 50%;animation:pop 8s cubic-bezier(.2,.9,.3,1.4) infinite}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 8s ease-out infinite}
.blink{animation:blink 2.4s ease-in-out infinite}
.drift{animation:drift 5s ease-in-out infinite alternate}
.packet{animation:packet 3.2s linear infinite}
.sweep{animation:sweep 6s linear infinite}
@keyframes rise{0%,86%{transform:scaleY(1)}87%{transform:scaleY(0)}100%{transform:scaleY(1)}}
@keyframes pop{0%,86%{transform:scale(1)}87%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes draw{0%,86%{stroke-dashoffset:0}87%{stroke-dashoffset:1}100%{stroke-dashoffset:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(22px)}}
@keyframes packet{0%{transform:translateX(0);opacity:1}92%{opacity:1}100%{transform:translateX(212px);opacity:0}}
@keyframes sweep{from{transform:translateX(-40px)}to{transform:translateX(680px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#c)">
<rect width="640" height="250" fill="#090A09"/>
<rect y="30" width="640" height="220" fill="url(#g)"/>
<rect x="340" y="30" width="300" height="220" fill="url(#o)"/>
<rect width="640" height="30" fill="#111211"/>
<circle cx="20" cy="15" r="5" fill="#FF5F57"/><circle cx="38" cy="15" r="5" fill="#FEBC2E"/><circle cx="56" cy="15" r="5" fill="#28C840"/>
<text x="320" y="19" text-anchor="middle" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#9a9c96">quantdeck.py</text>
<rect y="30" width="640" height="1" fill="#2a2c29"/>
<text x="28" y="66" font-family='Georgia,"Times New Roman",serif' font-size="26" font-weight="700" fill="#F4F5F2">quantdeck</text>
<text x="28" y="98" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="13" fill="#c7c9c4">Event-driven backtesting in Python,</text><text x="28" y="118" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="13" fill="#c7c9c4">market orders only, filled at the next</text><text x="28" y="138" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="13" fill="#c7c9c4">bar&#x27;s open plus slippage. Runs offline</text><text x="28" y="158" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="13" fill="#c7c9c4">on CSV files. Backtest only: no live or</text><text x="28" y="178" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="13" fill="#c7c9c4">paper trading.</text>
<rect x="28" y="210" width="58" height="22" rx="11" fill="#161715"/><text x="57" y="225" text-anchor="middle" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="11" fill="#9a9c96">Python</text><rect x="94" y="210" width="95" height="22" rx="11" fill="#161715"/><text x="142" y="225" text-anchor="middle" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="11" fill="#9a9c96">Backtesting</text>
<path d="M396,168 L420,160 L442,164 L466,144 L490,150 L514,122 L538,134 L562,104 L586,98 L610,82 L610,190 L396,190 Z" fill="#00FF66" fill-opacity="0.08"/><path class="draw" pathLength="1" d="M396,168 L420,160 L442,164 L466,144 L490,150 L514,122 L538,134 L562,104 L586,98 L610,82" fill="none" stroke="#00FF66" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><line x1="396" y1="190" x2="616" y2="190" stroke="#3d3f3b"/><circle class="blink" cx="610" cy="82" r="4.5" fill="#B6FF2E"/>
<rect class="sweep" x="0" y="31" width="40" height="219" fill="#00FF66" fill-opacity="0.035"/>
<rect x="0.5" y="0.5" width="639" height="249" rx="14" fill="none" stroke="#2a2c29"/>
</g>
</svg>
