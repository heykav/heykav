<svg width="640" height="250" viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">fpga-sim-core</title>
<desc id="d">A C++20 cycle model of an FPGA-style tick-to-trade path. Latency is counted in simulated cycles on synthetic data, so it is not a hardware or FPGA measurement. Decorative graphic, no data.</desc>
<defs>
<pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1a1b1a" stroke-width="1"/></pattern>
<clipPath id="c"><rect width="640" height="250" rx="14"/></clipPath>
<radialGradient id="o" cx="0.78" cy="0.55" r="0.5"><stop offset="0%" stop-color="#00FF66" stop-opacity="0.10"/><stop offset="100%" stop-color="#00FF66" stop-opacity="0"/></radialGradient>
</defs>
<style>
.rise{transform-box:fill-box;transform-origin:50% 100%;animation:rise 8s cubic-bezier(.2,.8,.2,1) infinite}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:rise 8s cubic-bezier(.2,.8,.2,1) infinite}
.pop{transform-box:fill-box;transform-origin:50% 50%;animation:pop 8s cubic-bezier(.2,.9,.3,1.4) infinite}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 8s ease-out infinite}
.blink{animation:blink 2.4s ease-in-out infinite}
.drift{animation:drift 5s ease-in-out infinite alternate}
.packet{animation:packet 3.2s linear infinite}
.sweep{animation:sweep 6s linear infinite}
@keyframes rise{0%,86%{transform:scaleY(1)}87%{transform:scaleY(0)}100%{transform:scaleY(1)}}
@keyframes pop{0%,86%{transform:scale(1)}87%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes draw{0%,86%{stroke-dashoffset:0}87%{stroke-dashoffset:1}100%{stroke-dashoffset:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(22px)}}
@keyframes packet{0%{transform:translateX(0);opacity:1}92%{opacity:1}100%{transform:translateX(212px);opacity:0}}
@keyframes sweep{from{transform:translateX(-40px)}to{transform:translateX(680px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#c)">
<rect width="640" height="250" fill="#090A09"/>
<rect y="30" width="640" height="220" fill="url(#g)"/>
<rect x="340" y="30" width="300" height="220" fill="url(#o)"/>
<rect width="640" height="30" fill="#111211"/>
<circle cx="20" cy="15" r="5" fill="#FF5F57"/><circle cx="38" cy="15" r="5" fill="#FEBC2E"/><circle cx="56" cy="15" r="5" fill="#28C840"/>
<text x="320" y="19" text-anchor="middle" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#9a9c96">datapath.cpp</text>
<rect y="30" width="640" height="1" fill="#2a2c29"/>
<text x="28" y="66" font-family='Georgia,"Times New Roman",serif' font-size="26" font-weight="700" fill="#F4F5F2">fpga-sim-core</text>
<text x="28" y="98" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="13" fill="#c7c9c4">A C++20 cycle model of an FPGA-style</text><text x="28" y="118" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="13" fill="#c7c9c4">tick-to-trade path. Latency is counted</text><text x="28" y="138" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="13" fill="#c7c9c4">in simulated cycles on synthetic data,</text><text x="28" y="158" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="13" fill="#c7c9c4">so it is not a hardware or FPGA</text><text x="28" y="178" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="13" fill="#c7c9c4">measurement.</text>
<rect x="28" y="210" width="36" height="22" rx="11" fill="#161715"/><text x="46" y="225" text-anchor="middle" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="11" fill="#9a9c96">C++</text><rect x="72" y="210" width="51" height="22" rx="11" fill="#161715"/><text x="98" y="225" text-anchor="middle" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="11" fill="#9a9c96">CMake</text>
<rect x="396" y="104" width="36" height="46" rx="4" fill="none" stroke="#3d3f3b"/><text x="414" y="132" text-anchor="middle" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="10" fill="#9a9c96">PCS</text><line x1="432" y1="127" x2="442" y2="127" stroke="#3d3f3b"/><rect x="442" y="104" width="36" height="46" rx="4" fill="none" stroke="#3d3f3b"/><text x="460" y="132" text-anchor="middle" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="10" fill="#9a9c96">MAC</text><line x1="478" y1="127" x2="488" y2="127" stroke="#3d3f3b"/><rect x="488" y="104" width="36" height="46" rx="4" fill="none" stroke="#3d3f3b"/><text x="506" y="132" text-anchor="middle" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="10" fill="#9a9c96">ITCH</text><line x1="524" y1="127" x2="534" y2="127" stroke="#3d3f3b"/><rect x="534" y="104" width="36" height="46" rx="4" fill="none" stroke="#3d3f3b"/><text x="552" y="132" text-anchor="middle" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="10" fill="#9a9c96">BOOK</text><line x1="570" y1="127" x2="580" y2="127" stroke="#3d3f3b"/><rect x="580" y="104" width="36" height="46" rx="4" fill="none" stroke="#3d3f3b"/><text x="598" y="132" text-anchor="middle" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="10" fill="#9a9c96">DMA</text><rect class="packet" x="394" y="118" width="12" height="18" rx="3" fill="#00FF66"/><text x="396" y="178" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="11" fill="#9a9c96">cycle model, not hardware</text>
<rect class="sweep" x="0" y="31" width="40" height="219" fill="#00FF66" fill-opacity="0.035"/>
<rect x="0.5" y="0.5" width="639" height="249" rx="14" fill="none" stroke="#2a2c29"/>
</g>
</svg>
