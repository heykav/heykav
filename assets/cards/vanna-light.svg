<text x="320" y="19" text-anchor="middle" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#54564f">vanna.py</text>
<rect y="30" width="640" height="1" fill="#c4c7c0"/>
<text x="28" y="66" font-family='Georgia,"Times New Roman",serif' font-size="26" font-weight="700" fill="#111211">vanna</text>
<text x="28" y="98" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="13" fill="#3d3f3b">Options pricing and P&amp;L attribution:</text><text x="28" y="118" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="13" fill="#3d3f3b">Black-Scholes and a binomial tree, with</text><text x="28" y="138" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="13" fill="#3d3f3b">each trade&#x27;s P&amp;L split into Greeks and</text><text x="28" y="158" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="13" fill="#3d3f3b">an honest residual. Backtests run on</text><text x="28" y="178" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="13" fill="#3d3f3b">simulated prices only.</text>
<rect x="28" y="210" width="58" height="22" rx="11" fill="#e6e8e3"/><text x="57" y="225" text-anchor="middle" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="11" fill="#3d3f3b">Python</text><rect x="94" y="210" width="66" height="22" rx="11" fill="#e6e8e3"/><text x="127" y="225" text-anchor="middle" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="11" fill="#3d3f3b">PySide6</text><rect x="168" y="210" width="51" height="22" rx="11" fill="#e6e8e3"/><text x="194" y="225" text-anchor="middle" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="11" fill="#3d3f3b">NumPy</text>
