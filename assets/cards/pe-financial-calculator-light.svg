<svg width="640" height="250" viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">pe-financial-calculator</title>
<desc id="d">Rivet, a browser-based LBO and DCF calculator for a first-pass look at a deal. Illustrative: gross returns, no taxes, fees or three-statement model. Decorative graphic, no data.</desc>
<defs>
<pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#e2e3df" stroke-width="1"/></pattern>
<clipPath id="c"><rect width="640" height="250" rx="14"/></clipPath>
<radialGradient id="o" cx="0.78" cy="0.55" r="0.5"><stop offset="0%" stop-color="#00A84A" stop-opacity="0.08"/><stop offset="100%" stop-color="#00A84A" stop-opacity="0"/></radialGradient>
</defs>
<style>
.rise{transform-box:fill-box;transform-origin:50% 100%;animation:rise 8s cubic-bezier(.2,.8,.2,1) infinite}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:rise 8s cubic-bezier(.2,.8,.2,1) infinite}
.pop{transform-box:fill-box;transform-origin:50% 50%;animation:pop 8s cubic-bezier(.2,.9,.3,1.4) infinite}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 8s ease-out infinite}
.blink{animation:blink 2.4s ease-in-out infinite}
.drift{animation:drift 5s ease-in-out infinite alternate}
.packet{animation:packet 3.2s linear infinite}
.sweep{animation:sweep 6s linear infinite}
@keyframes rise{0%,86%{transform:scaleY(1)}87%{transform:scaleY(0)}100%{transform:scaleY(1)}}
@keyframes pop{0%,86%{transform:scale(1)}87%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes draw{0%,86%{stroke-dashoffset:0}87%{stroke-dashoffset:1}100%{stroke-dashoffset:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(22px)}}
@keyframes packet{0%{transform:translateX(0);opacity:1}92%{opacity:1}100%{transform:translateX(212px);opacity:0}}
@keyframes sweep{from{transform:translateX(-40px)}to{transform:translateX(680px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#c)">
<rect width="640" height="250" fill="#F4F5F2"/>
<rect y="30" width="640" height="220" fill="url(#g)"/>
<rect x="340" y="30" width="300" height="220" fill="url(#o)"/>
<rect width="640" height="30" fill="#eceeea"/>
<circle cx="20" cy="15" r="5" fill="#FF5F57"/><circle cx="38" cy="15" r="5" fill="#FEBC2E"/><circle cx="56" cy="15" r="5" fill="#28C840"/>
<text x="320" y="19" text-anchor="middle" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="12" fill="#54564f">rivet.js</text>
<rect y="30" width="640" height="1" fill="#c4c7c0"/>
<text x="28" y="66" font-family='Georgia,"Times New Roman",serif' font-size="26" font-weight="700" fill="#111211">pe-financial-calculator</text>
<text x="28" y="98" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="13" fill="#3d3f3b">Rivet, a browser-based LBO and DCF</text><text x="28" y="118" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="13" fill="#3d3f3b">calculator for a first-pass look at a</text><text x="28" y="138" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="13" fill="#3d3f3b">deal. Illustrative: gross returns, no</text><text x="28" y="158" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="13" fill="#3d3f3b">taxes, fees or three-statement model.</text>
<rect x="28" y="210" width="88" height="22" rx="11" fill="#e6e8e3"/><text x="72" y="225" text-anchor="middle" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="11" fill="#3d3f3b">JavaScript</text><rect x="124" y="210" width="73" height="22" rx="11" fill="#e6e8e3"/><text x="161" y="225" text-anchor="middle" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="11" fill="#3d3f3b">HTML/CSS</text>
<rect class="rise" style="animation-delay:0.00s" x="404" y="141.0" width="30" height="45.0" rx="2" fill="#00A84A"/><rect class="rise" style="animation-delay:0.15s" x="446" y="150.0" width="30" height="36.0" rx="2" fill="#00A84A"/><rect class="rise" style="animation-delay:0.30s" x="488" y="96.0" width="30" height="54.0" rx="2" fill="#00A84A"/><rect class="rise" style="animation-delay:0.45s" x="530" y="96.0" width="30" height="27.0" rx="2" fill="#aab0a3"/><rect class="rise" style="animation-delay:0.60s" x="572" y="96.0" width="30" height="90.0" rx="2" fill="#5f9a00"/><line x1="396" y1="186" x2="616" y2="186" stroke="#aab0a3"/>
<rect class="sweep" x="0" y="31" width="40" height="219" fill="#00A84A" fill-opacity="0.035"/>
<rect x="0.5" y="0.5" width="639" height="249" rx="14" fill="none" stroke="#c4c7c0"/>
</g>
</svg>
