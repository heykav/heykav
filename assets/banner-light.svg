<title id="bn-t">Krishna Anubhav: finance, engineering and quantitative systems</title>
<desc id="bn-d">Profile banner for Krishna Anubhav (Kavy). Engineer, then SaaS founder and operator, then MBA, now investment banking. I spent years building businesses; now I am learning how investors value them. The rising line on the right is decorative and carries no data.</desc>
