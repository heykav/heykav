<circle class="ring" cx="1160" cy="84" r="4.5" fill="none" stroke="#5f9a00" stroke-width="1.6"/>
<text class="a up" style="animation-delay:.1s" x="56" y="84" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="13" fill="#006b2e" letter-spacing="2.4">FINANCE × ENGINEERING × QUANTITATIVE SYSTEMS</text>
<text class="a up" style="animation-delay:.28s" x="56" y="144" font-family='Georgia,"Times New Roman",serif' font-size="50" font-weight="700" fill="#111211">Krishna Anubhav</text>
<text class="a up" style="animation-delay:.55s" x="56" y="184" font-family='system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="19" fill="#3d3f3b">Engineer <tspan fill="#5f9a00">→</tspan> SaaS founder/operator <tspan fill="#5f9a00">→</tspan> MBA <tspan fill="#5f9a00">→</tspan> Investment banking</text>
<rect class="a rule" x="56" y="206" width="48" height="2" fill="url(#bn-signal)"/>
<g clip-path="url(#bn-type)"><text x="56" y="244" font-family='ui-monospace,"SFMono-Regular","DM Mono",Menlo,Consolas,monospace' font-size="15" fill="#54564f">I spent years building businesses. Now I&#39;m learning how investors value them.</text></g>
