<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="KAVY — Krishna Anubhav. Engineer, SaaS founder and operator, MBA, now investment banking. Rigorous thinking. Human explanations. Verified: vanna 120/120 tests, quantdeck 21/21, microprice-rust 124/124, fpga-sim-core 3/3 suites passing.">
