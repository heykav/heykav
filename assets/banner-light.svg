</g>
<path class="a line" pathLength="1" stroke-dasharray="1" d="M 800 246 C 850 242, 890 230, 930 218 S 1000 190, 1050 164 S 1110 114, 1160 84" fill="none" stroke="url(#bn-signal)" stroke-width="2.4" stroke-linecap="round"/>
<circle class="a pop" style="animation-delay:1.45s" cx="930" cy="218" r="4" fill="#F4F5F2" stroke="#00A84A" stroke-width="1.8"/>
<circle class="a pop" style="animation-delay:1.95s" cx="1050" cy="164" r="4" fill="#F4F5F2" stroke="#00A84A" stroke-width="1.8"/>
