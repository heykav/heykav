<svg width="1200" height="236" viewBox="0 0 1200 236" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Krishna Anubhav on GitHub: 6 original public repos; 41 pull requests opened on other projects, 16 merged, 20 open and 5 closed without merging; on GitHub since 2022; language mix across own repos by bytes: Python 41%, Rust 36%, C++ 9%, JavaScript 7%">
  <defs>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1b1a" stroke-width="1"/>
    </pattern>
    <clipPath id="clip2"><rect width="1200" height="236" rx="14"/></clipPath>
  </defs>
  <style>
    .a{animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.7,.2,1)}
    .up{animation-name:up;animation-duration:.7s}
    @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .bar{transform-box:fill-box;transform-origin:0 50%;animation-name:grow;animation-duration:.9s}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @media (prefers-reduced-motion:reduce){.a{animation:none!important}}
  </style>
  <g clip-path="url(#clip2)" font-family='ui-monospace, "SFMono-Regular", "DM Mono", Menlo, Consolas, monospace'>
    <rect width="1200" height="236" fill="#090A09"/>
    <rect width="1200" height="236" fill="url(#grid2)"/>
    <text x="56" y="50" font-size="13" fill="#8a8c87" letter-spacing="1.5">GITHUB DATA, REGENERATED BY scripts/update_profile.py</text>
    <text class="a up" style="animation-delay:0.10s" x="56" y="102" font-size="34" font-weight="700" fill="#F4F5F2">6</text>
    <text class="a up" style="animation-delay:0.10s" x="56" y="126" font-size="14" fill="#9a9c96">original public repos</text>
    <text class="a up" style="animation-delay:0.22s" x="316" y="102" font-size="34" font-weight="700" fill="#F4F5F2">41</text>
    <text class="a up" style="animation-delay:0.22s" x="316" y="126" font-size="14" fill="#9a9c96">pull requests to other projects</text>
    <text class="a up" style="animation-delay:0.34s" x="646" y="102" font-size="34" font-weight="700" fill="#B6FF2E">16</text>
    <text class="a up" style="animation-delay:0.34s" x="646" y="126" font-size="14" fill="#9a9c96">merged, 20 open, 5 closed</text>
    <text class="a up" style="animation-delay:0.46s" x="936" y="102" font-size="34" font-weight="700" fill="#F4F5F2">2022</text>
    <text class="a up" style="animation-delay:0.46s" x="936" y="126" font-size="14" fill="#9a9c96">on GitHub since</text>
    <text x="56" y="164" font-size="13" fill="#8a8c87" letter-spacing="1">LANGUAGE MIX BY BYTES, OWN REPOS</text>
    <rect x="56" y="178" width="1088" height="10" rx="5" fill="#1a1b1a"/>
    <rect class="a bar" style="animation-delay:0.50s" x="56" y="178" width="480" height="10" fill="#00FF66"/>
    <rect class="a bar" style="animation-delay:0.68s" x="538" y="178" width="418" height="10" fill="#B6FF2E"/>
    <rect class="a bar" style="animation-delay:0.86s" x="958" y="178" width="98" height="10" fill="#8a8c87"/>
    <rect class="a bar" style="animation-delay:1.04s" x="1058" y="178" width="86" height="10" fill="#5d605a"/>
    <g font-size="14">
      <circle cx="60" cy="209" r="5" fill="#00FF66"/>
      <text x="72" y="214" fill="#9a9c96">Python 41%</text>
      <circle cx="185" cy="209" r="5" fill="#B6FF2E"/>
      <text x="197" y="214" fill="#9a9c96">Rust 36%</text>
      <circle cx="293" cy="209" r="5" fill="#8a8c87"/>
      <text x="305" y="214" fill="#9a9c96">C++ 9%</text>
      <circle cx="384" cy="209" r="5" fill="#5d605a"/>
      <text x="396" y="214" fill="#9a9c96">JavaScript 7%</text>
    </g>
  </g>
</svg>
