<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Krishna Anubhav on GitHub: 6 original public repos; 46 pull requests opened on other projects, 20 merged, 21 open and 5 closed without merging; on GitHub since 2022; language mix across own repos by bytes: Python 41%, Rust 36%, C++ 9%, JavaScript 7%">
  <defs>
