    <text x="936" y="126" font-size="14" fill="#54564f">on GitHub since</text>
    <text x="56" y="164" font-size="13" fill="#5d605a" letter-spacing="1">LANGUAGE MIX BY BYTES, OWN REPOS</text>
    <polygon points="56,300 1110,300 1144,280 90,280" fill="#e2e3df"/>
    <g class="col" style="animation-delay:0.00s"><rect x="96" y="188" width="120" height="112" fill="#006b2e"/><polygon points="216,300 250,280 250,168 216,188" fill="#00461e"/><polygon points="96,188 216,188 250,168 130,168" fill="#73ae8c"/></g>
    <g class="col" style="animation-delay:0.15s"><rect x="364" y="202" width="120" height="98" fill="#5f9a00"/><polygon points="484,300 518,280 518,182 484,202" fill="#3e6400"/><polygon points="364,202 484,202 518,182 398,182" fill="#a7c773"/></g>
    <g class="col" style="animation-delay:0.30s"><rect x="632" y="277" width="120" height="23" fill="#3d3f3b"/><polygon points="752,300 786,280 786,257 752,277" fill="#282926"/><polygon points="632,277 752,277 786,257 666,257" fill="#949593"/></g>
