    <g>
      <rect x="56" y="168" width="1088" height="10" rx="5" fill="#e2e3df"/>
      <rect x="56" y="168" width="440" height="10" fill="#00FF66"/>
<rect x="496" y="168" width="394" height="10" fill="#6fd94f"/>
