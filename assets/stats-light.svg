      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e3df" stroke-width="1"/>
    </pattern>
    <clipPath id="clip2"><rect width="1200" height="340" rx="14"/></clipPath>
  </defs>
  <style>
    .col{transform-box:fill-box;transform-origin:50% 100%;animation:rise 12s cubic-bezier(.2,.7,.2,1) infinite}
