    .pct{animation:pct 12s linear infinite}
    @keyframes pct{0%,62%{opacity:1}64%,82%{opacity:0}86%,100%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.col,.pct{animation:none!important}}
  </style>
