<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Krishna Anubhav on GitHub: 6 original public repos; 48 pull requests opened on other projects, 20 merged, 22 open and 6 closed without merging; on GitHub since 2022; language mix across own repos by bytes: Python 41%, Rust 36%, C++ 9%, JavaScript 7%">
  <defs>
