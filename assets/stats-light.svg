    <text x="936" y="126" font-size="16" fill="#54564f">on GitHub since</text>
    <text x="56" y="164" font-size="15" fill="#5d605a" letter-spacing="1">LANGUAGE MIX BY BYTES, OWN REPOS</text>
    <polygon points="56,336 1110,336 1144,316 90,316" fill="#e2e3df"/>
    <g class="col" style="animation-delay:0.00s"><rect x="96" y="224" width="120" height="112" fill="#006b2e"/><polygon points="216,336 250,316 250,204 216,224" fill="#00461e"/><polygon points="96,224 216,224 250,204 130,204" fill="#73ae8c"/></g>
    <g class="col" style="animation-delay:0.15s"><rect x="364" y="238" width="120" height="98" fill="#5f9a00"/><polygon points="484,336 518,316 518,218 484,238" fill="#3e6400"/><polygon points="364,238 484,238 518,218 398,218" fill="#a7c773"/></g>
    <g class="col" style="animation-delay:0.30s"><rect x="632" y="313" width="120" height="23" fill="#3d3f3b"/><polygon points="752,336 786,316 786,293 752,313" fill="#282926"/><polygon points="632,313 752,313 786,293 666,293" fill="#949593"/></g>
